<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>☕ Espresso Calibration Pro</title>

<style>

:root{
    --bg:#0f1115;
    --card:#1b1f24;
    --card2:#252b34;
    --gold:#c58b45;
    --green:#22c55e;
    --orange:#f59e0b;
    --red:#ef4444;
    --gray:#9ca3af;
    --white:#ffffff;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:system-ui,-apple-system,sans-serif;
}

body{
    background:var(--bg);
    color:var(--white);
    padding:15px;
    padding-bottom:120px;
}

.header{
    text-align:center;
    margin-bottom:20px;
}

.logo{
    font-size:64px;
}

.title{
    font-size:30px;
    font-weight:700;
}

.subtitle{
    color:var(--gray);
    margin-top:8px;
}

.card{
    background:var(--card);
    border-radius:22px;
    padding:18px;
    margin-bottom:15px;
    box-shadow:0 8px 20px rgba(0,0,0,.25);
}

.card h2{
    margin-bottom:15px;
}

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
}

.stat{
    background:var(--card2);
    border-radius:16px;
    padding:15px;
    text-align:center;
}

.stat h3{
    color:var(--gold);
    font-size:24px;
}

.stat span{
    color:var(--gray);
    font-size:12px;
}

.estado{
    margin-top:15px;
    text-align:center;
    padding:18px;
    border-radius:18px;
    font-size:20px;
    font-weight:700;
}

.ok{
    color:var(--green);
    border:2px solid var(--green);
    background:rgba(34,197,94,.10);
}

.warn{
    color:var(--orange);
    border:2px solid var(--orange);
    background:rgba(245,158,11,.10);
}

.bad{
    color:var(--red);
    border:2px solid var(--red);
    background:rgba(239,68,68,.10);
}

.grid{
    display:flex;
    flex-direction:column;
    gap:12px;
}

label{
    display:block;
    margin-bottom:6px;
    color:var(--gray);
    font-size:13px;
}

input,
select{
    width:100%;
    height:58px;
    border:none;
    outline:none;
    border-radius:14px;
    background:var(--card2);
    color:white;
    padding:12px;
    font-size:18px;
}

.btn{
    width:100%;
    height:60px;
    border:none;
    border-radius:18px;
    background:var(--gold);
    color:white;
    font-size:18px;
    font-weight:700;
}

.crono-card{
    text-align:center;
}

.cronometro{
    font-size:68px;
    font-weight:700;
    color:var(--gold);
    margin:15px 0;
}

.running{
    animation:pulse 1s infinite;
}

@keyframes pulse{

0%{
transform:scale(1);
color:var(--gold);
}

50%{
transform:scale(1.08);
color:var(--green);
}

100%{
transform:scale(1);
color:var(--gold);
}

}

.crono-buttons{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:10px;
}

.start-btn,
.stop-btn,
.reset-btn{
    height:55px;
    border:none;
    border-radius:14px;
    color:white;
    font-weight:700;
    font-size:16px;
}

.start-btn{
    background:var(--green);
}

.stop-btn{
    background:var(--red);
}

.reset-btn{
    background:#374151;
}

.registro{
    background:var(--card2);
    padding:15px;
    border-radius:18px;
    margin-bottom:12px;
    border-left:5px solid var(--gold);
}

.registro h3{
    margin-bottom:8px;
}

.registro p{
    margin:5px 0;
}

.registro small{
    color:var(--gray);
}

.footer{
    text-align:center;
    color:var(--gray);
    margin-top:20px;
}
.ratio-slider{
    width:100%;
    height:10px;
    appearance:none;
    background:#374151;
    border-radius:20px;
    margin-top:10px;
}

.ratio-slider::-webkit-slider-thumb{
    appearance:none;
    width:24px;
    height:24px;
    border-radius:50%;
    background:var(--gold);
    cursor:pointer;
    border:3px solid white;
}

.ratio-labels{
    display:flex;
    justify-content:space-between;
    margin-top:8px;
    font-size:12px;
    color:var(--gray);
}

.peso-objetivo{
    margin-top:12px;
    padding:12px;
    border-radius:12px;
    background:var(--card2);
    text-align:center;
    font-size:18px;
    font-weight:700;
    color:var(--gold);
}
    
</style>
</head>
    
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
<body>
<div>

</div>
    <div>

    <label>
        Ratio Objetivo:
        <span id="ratioValue">1:2.0</span>
    </label>

    <input
        type="range"
        id="ratioObjetivo"
        min="1"
        max="3.5"
        step="0.1"
        value="2"
        oninput="actualizarRatio()"
        class="ratio-slider"
    >

    <div class="ratio-labels">
        <span>1:1</span>
        <span>1:2</span>
        <span>1:3.5</span>
    </div>

    <div id="pesoObjetivo"
         class="peso-objetivo">
        Salida objetivo: --
    </div>

</div>
<div class="header">
    <div class="logo">☕</div>
    <div class="title">Espresso Calibration Pro</div>
    <div class="subtitle">Control profesional de extracción</div>
</div>

<div class="card">

    <div class="stats">

        <div class="stat">
            <h3 id="ratioLive">1:0</h3>
            <span>RATIO</span>
        </div>

        <div class="stat">
            <h3 id="tiempoLive">0s</h3>
            <span>TIEMPO</span>
        </div>

        <div class="stat">
            <h3 id="estadoLive">---</h3>
            <span>SHOT</span>
        </div>

    </div>

    <div id="estado" class="estado">
        Esperando extracción...
    </div>

</div>

<div class="card crono-card">

    <h2>⏱️ Cronómetro</h2>

    <div id="cronometro" class="cronometro">
        00.0
    </div>

    <div class="crono-buttons">

        <button class="start-btn" onclick="startCrono()">
            ▶ START
        </button>

        <button class="stop-btn" onclick="stopCrono()">
            ■ STOP
        </button>

        <button class="reset-btn" onclick="resetCrono()">
            ↺ RESET
        </button>

    </div>

    <p style="color:var(--gray);margin-top:10px;">
        STOP copiará automáticamente el tiempo al formulario
    </p>

</div>

<div class="card">

    <h2>Nueva Extracción</h2>

    <div class="grid">

        <div>
            <label>Café</label>
            <input
            type="text"
            id="cafe"
            placeholder="Colombia, Brasil, Etiopía...">
        </div>

        <div>
            <label>Dosis (g)</label>
            <input
            type="number"
            id="dosis"
            step="0.1"
            oninput="actualizarPreview()">
        </div>

        <div>
            <label>Bebida final (g)</label>
            <input
            type="number"
            id="taza"
            step="0.1"
            oninput="actualizarPreview()">
        </div>

        <div>
            <label>Tiempo (s)</label>
            <input
            type="number"
            id="tiempo"
            step="0.1"
            oninput="actualizarPreview()">
        </div>

        <div>
            <label>Temperatura °C</label>
            <input
            type="number"
            id="temp"
            value="90">
        </div>

        <div>
            <label>Molienda</label>
            <input
            type="text"
            id="molienda"
            placeholder="5.4">
        </div>

        <div>
            <label>Sabor</label>
            <select id="sabor">
                <option>Equilibrado</option>
                <option>Dulce</option>
                <option>Ácido</option>
                <option>Amargo</option>
                <option>Aguado</option>
            </select>
        </div>

    </div>

    <br>

    <button class="btn" onclick="registrar()">
        Guardar Shot
    </button>

</div>

<div class="card">

    <h2>📋 Historial</h2>

    <div id="historial"></div>

</div>

<div class="footer">
    Krusty Web App - Madrid - 2026
</div>

<script>
    
    function actualizarRatio(){

    const ratio =
    parseFloat(
        document.getElementById(
            "ratioObjetivo"
        ).value
    );

    document.getElementById(
        "ratioValue"
    ).innerText =
    "1:" + ratio.toFixed(1);

    calcularSalidaObjetivo();
        }
    function calcularSalidaObjetivo(){

    const dosis =
    parseFloat(
        document.getElementById(
            "dosis"
        ).value
    ) || 0;

    const ratio =
    parseFloat(
        document.getElementById(
            "ratioObjetivo"
        ).value
    );

    const objetivo =
    (dosis * ratio).toFixed(1);

    document.getElementById(
        "pesoObjetivo"
    ).innerHTML =
    `🎯 Salida objetivo: ${objetivo} g`;

}
const beep =
new Audio(
"https://actions.google.com/sounds/v1/alarms/beep_short.ogg"
);
    
let tiemposExtraccion = [];
let chart;
let aviso28s = false;
    
let cronometroInterval;
let inicio;
let corriendo=false;

function actualizarPreview(){
    
    calcularSalidaObjetivo();
    
    let dosis=parseFloat(
    document.getElementById("dosis").value)||0;

    let taza=parseFloat(
    document.getElementById("taza").value)||0;

    let tiempo=parseFloat(
    document.getElementById("tiempo").value)||0;

    if(dosis>0 && taza>0){

        document.getElementById(
        "ratioLive"
        ).innerText=
        "1:"+(taza/dosis).toFixed(2);

    }

    document.getElementById(
    "tiempoLive"
    ).innerText=
    tiempo+"s";
}

function startCrono(){

    if(corriendo) return;

    corriendo=true;

    inicio=Date.now();

    document
    .getElementById("cronometro")
    .classList.add("running");

    cronometroInterval=setInterval(()=>{

if(
segundos >= 28 &&
!aviso28s
){

    aviso28s = true;

    beep.play();

    navigator.vibrate?.(300);

}
        
        let segundos=
        (Date.now()-inicio)/1000;

        document
        .getElementById("cronometro")
        .innerText=
        segundos.toFixed(1);

    },100);
}
aviso28s = false;
function stopCrono(){

    clearInterval(cronometroInterval);

    corriendo=false;

    document
    .getElementById("cronometro")
    .classList.remove("running");

    let tiempoFinal=parseFloat(
    document.getElementById(
    "cronometro").innerText);

    document
    .getElementById("tiempo")
    .value=
    tiempoFinal.toFixed(1);

    actualizarPreview();
}
 function actualizarPreview(){

    let dosis =
    parseFloat(
    document.getElementById("dosis").value
    ) || 0;

    let ratioObjetivo =
    parseFloat(
    document.getElementById("ratioObjetivo").value
    ) || 2;

    if(dosis > 0){

        let bebidaObjetivo =
        (dosis * ratioObjetivo).toFixed(1);

        document.getElementById(
        "ratioLive"
        ).innerText =
        "1:" + ratioObjetivo;

        document.getElementById(
        "taza"
        ).placeholder =
        bebidaObjetivo + " g";
    }

function resetCrono(){

    clearInterval(cronometroInterval);

    corriendo=false;

    document
    .getElementById("cronometro")
    .classList.remove("running");

    document
    .getElementById("cronometro")
    .innerText="00.0";
}

function registrar(){
    const ratioObjetivo =
parseFloat(
document.getElementById(
"ratioObjetivo"
).value
);

const ratioReal =
(taza/dosis).toFixed(2);

const diferencia =
(
ratioReal - ratioObjetivo
).toFixed(2);
let ratioReal =
(taza / dosis).toFixed(2);

let ratioObjetivo =
parseFloat(
document.getElementById(
"ratioObjetivo"
).value
);

let diferencia =
(
ratioReal - ratioObjetivo
).toFixed(2);
    
tiemposExtraccion.push(tiempo);

localStorage.setItem(
"espresso_tiempos",
JSON.stringify(tiemposExtraccion)
);

actualizarGrafico();
    
    let cafe=
    document.getElementById("cafe").value;

    let dosis=
    parseFloat(document.getElementById("dosis").value);

    let taza=
    parseFloat(document.getElementById("taza").value);

    let tiempo=
    parseFloat(document.getElementById("tiempo").value);

    let temp=
    document.getElementById("temp").value;

    let molienda=
    document.getElementById("molienda").value;

    let sabor=
    document.getElementById("sabor").value;

    if(!dosis||!taza||!tiempo){

        alert(
        "Completa dosis, bebida final y tiempo.");

        return;
    }

    let ratio=
    (taza/dosis).toFixed(2);

    let clase="";
    let estado="";
    let accion="";
    let emoji="";

    if(tiempo<25){

        clase="warn";
        estado="SUBEXTRACCIÓN";
        accion="Cerrar molienda";
        emoji="🟠";

    }
    else if(tiempo>32){

        clase="bad";
        estado="SOBREEXTRACCIÓN";
        accion="Abrir molienda";
        emoji="🔴";

    }
    else{

        clase="ok";
        estado="PERFECTA";
        accion="Mantener receta";
        emoji="🟢";

    }

    document.getElementById(
    "estado").className=
    "estado "+clase;

    document.getElementById(
    "estado").innerHTML=
    `
    ${emoji}<br>
    ${estado}<br>
    Ratio 1:${ratio}
    `;

    document.getElementById(
    "estadoLive"
    ).innerText=
    estado.substring(0,3);

    let hora=
    new Date().toLocaleString();

    let registro=`
    <div class="registro">

        <h3>${emoji} ${cafe}</h3>

        <p>⚖️ Dosis: <b>${dosis}g</b></p>

        <p>☕ Bebida: <b>${taza}g</b></p>

        <p>📊 Ratio: <b>1:${ratio}</b></p>

        <p>⏱️ Tiempo: <b>${tiempo}s</b></p>

        <p>🌡️ Temperatura: <b>${temp}°C</b></p>

        <p>⚙️ Molienda: <b>${molienda}</b></p>

        <p>👅 Sabor: <b>${sabor}</b></p>

        <p><strong>${accion}</strong></p>

        <small>${hora}</small>

function crearGrafico(){

    const ctx =
    document.getElementById(
    "consistencyChart"
    );

    chart = new Chart(ctx,{

        type:'line',

        data:{
            labels:[],
            datasets:[{
                label:'Tiempo Extracción (s)',
                data:[],
                borderColor:'#c58b45',
                backgroundColor:'rgba(197,139,69,.25)',
                tension:.35,
                fill:true
            }]
        },

        options:{
            responsive:true,

            plugins:{
                legend:{
                    labels:{
                        color:'white'
                    }
                }
            },

            scales:{
                x:{
                    ticks:{
                        color:'#9ca3af'
                    }
                },
                y:{
                    ticks:{
                        color:'#9ca3af'
                    },
                    min:15,
                    max:40
                }
            }
        }

    });

}
        
    </div>
    `;

    document
    .getElementById("historial")
    .insertAdjacentHTML(
    "afterbegin",
    registro);

    localStorage.setItem(
    "espresso_historial",
    document.getElementById(
    "historial").innerHTML);

}

window.onload=function(){

    <div class="card">

    <h2>📈 Consistencia de Extracción</h2>

    <canvas id="consistencyChart"></canvas>
crearGrafico();

const guardados =
JSON.parse(
localStorage.getItem("espresso_tiempos")
) || [];

tiemposExtraccion = guardados;

function actualizarGrafico(){

    if(!chart) return;

    chart.data.labels =
    tiemposExtraccion.map((_,i)=>`#${i+1}`);

    chart.data.datasets[0].data =
    tiemposExtraccion;

    chart.update();

}
    
</div>
    const historial=
    localStorage.getItem(
    "espresso_historial");

    if(historial){

        document.getElementById(
        "historial").innerHTML=
        historial;

    }

};

</script>

</body>
</html>
