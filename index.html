<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>☕ Espresso Calibration Pro</title>

<style>

:root{
    --bg:#0f1115;
    --card:#1b1f24;
    --card2:#252b34;
    --gold:#c58b45;
    --green:#22c55e;
    --orange:#f59e0b;
    --red:#ef4444;
    --gray:#9ca3af;
    --white:#ffffff;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:system-ui,-apple-system,sans-serif;
}

body{
    background:var(--bg);
    color:var(--white);
    padding:15px;
    padding-bottom:120px;
}

.header{
    text-align:center;
    margin-bottom:20px;
}

.logo{
    font-size:64px;
}

.title{
    font-size:30px;
    font-weight:700;
}

.subtitle{
    color:var(--gray);
    margin-top:8px;
}

.card{
    background:var(--card);
    border-radius:22px;
    padding:18px;
    margin-bottom:15px;
    box-shadow:0 8px 20px rgba(0,0,0,.25);
}

.card h2{
    margin-bottom:15px;
}

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
}

.stat{
    background:var(--card2);
    border-radius:16px;
    padding:15px;
    text-align:center;
}

.stat h3{
    color:var(--gold);
    font-size:24px;
}

.stat span{
    color:var(--gray);
    font-size:12px;
}

.estado{
    margin-top:15px;
    text-align:center;
    padding:18px;
    border-radius:18px;
    font-size:20px;
    font-weight:700;
}

.ok{
    color:var(--green);
    border:2px solid var(--green);
    background:rgba(34,197,94,.10);
}

.warn{
    color:var(--orange);
    border:2px solid var(--orange);
    background:rgba(245,158,11,.10);
}

.bad{
    color:var(--red);
    border:2px solid var(--red);
    background:rgba(239,68,68,.10);
}

.grid{
    display:flex;
    flex-direction:column;
    gap:12px;
}

label{
    display:block;
    margin-bottom:6px;
    color:var(--gray);
    font-size:13px;
}

input,
select{
    width:100%;
    height:58px;
    border:none;
    outline:none;
    border-radius:14px;
    background:var(--card2);
    color:white;
    padding:12px;
    font-size:18px;
}

.btn{
    width:100%;
    height:60px;
    border:none;
    border-radius:18px;
    background:var(--gold);
    color:white;
    font-size:18px;
    font-weight:700;
}

.crono-card{
    text-align:center;
}

.cronometro{
    font-size:68px;
    font-weight:700;
    color:var(--gold);
    margin:15px 0;
}

.running{
    animation:pulse 1s infinite;
}

@keyframes pulse{

0%{
transform:scale(1);
color:var(--gold);
}

50%{
transform:scale(1.08);
color:var(--green);
}

100%{
transform:scale(1);
color:var(--gold);
}

}

.crono-buttons{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:10px;
}

.start-btn,
.stop-btn,
.reset-btn{
    height:55px;
    border:none;
    border-radius:14px;
    color:white;
    font-weight:700;
    font-size:16px;
}

.start-btn{
    background:var(--green);
}

.stop-btn{
    background:var(--red);
}

.reset-btn{
    background:#374151;
}

.registro{
    background:var(--card2);
    padding:15px;
    border-radius:18px;
    margin-bottom:12px;
    border-left:5px solid var(--gold);
}

.registro h3{
    margin-bottom:8px;
}

.registro p{
    margin:5px 0;
}

.registro small{
    color:var(--gray);
}

.footer{
    text-align:center;
    color:var(--gray);
    margin-top:20px;
}
.ratio-slider{
    width:100%;
    height:10px;
    appearance:none;
    background:#374151;
    border-radius:20px;
    margin-top:10px;
}

.ratio-slider::-webkit-slider-thumb{
    appearance:none;
    width:24px;
    height:24px;
    border-radius:50%;
    background:var(--gold);
    cursor:pointer;
    border:3px solid white;
}

.ratio-labels{
    display:flex;
    justify-content:space-between;
    margin-top:8px;
    font-size:12px;
    color:var(--gray);
}

.peso-objetivo{
    margin-top:12px;
    padding:12px;
    border-radius:12px;
    background:var(--card2);
    text-align:center;
    font-size:18px;
    font-weight:700;
    color:var(--gold);
}
    #notasSugeridas{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:10px;
}

#notasSeleccionadas{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:12px;
}

.chip{
    padding:10px 14px;
    border-radius:999px;
    background:#374151;
    color:white;
    cursor:pointer;
    font-size:14px;
    transition:.2s;
}

.chip:hover{
    transform:scale(1.05);
}

.chip-selected{
    background:#c58b45;
    color:white;
}
</style>
</head>
    
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    function actualizarRatio(){

    const ratio =
    parseFloat(
        document.getElementById(
            "ratioObjetivo"
        ).value
    );

    document.getElementById(
        "ratioValue"
    ).innerText =
    "1:" + ratio.toFixed(1);

    calcularSalidaObjetivo();
        }
    function calcularSalidaObjetivo(){

    const dosis =
    parseFloat(
        document.getElementById(
            "dosis"
        ).value
    ) || 0;

    const ratio =
    parseFloat(
        document.getElementById(
            "ratioObjetivo"
        ).value
    );

    const objetivo =
    (dosis * ratio).toFixed(1);

    document.getElementById(
        "pesoObjetivo"
    ).innerHTML =
    `🎯 Salida objetivo: ${objetivo} g`;

}

        document

function stopCrono(){

    clearInterval(cronometroInterval);

    .getElementById("cronometro")
    .classList.remove("running");

    let tiempoFinal=parseFloat(
    document.getElementById(
    "cronometro").innerText);

    document
    .getElementById("tiempo")
    .value=
    tiempoFinal.toFixed(1);

    actualizarPreview();
}
 function actualizarPreview(){

    let dosis =
    parseFloat(
    document.getElementById("dosis").value
    ) || 0;

    let ratioObjetivo =
    parseFloat(
    document.getElementById("ratioObjetivo").value
    ) || 2;

    if(dosis > 0){

        let bebidaObjetivo =
        (dosis * ratioObjetivo).toFixed(1);

        document.getElementById(
        "ratioLive"
        ).innerText =
        "1:" + ratioObjetivo;

        document.getElementById(
        "taza"
        ).placeholder =
        bebidaObjetivo + " g";
    }

function resetCrono(){

    clearInterval(cronometroInterval);

    corriendo=false;

    document
    .getElementById("cronometro")
    .classList.remove("running");

    document
    .getElementById("cronometro")
    .innerText="00.0";
}
